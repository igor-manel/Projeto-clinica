# Perfil de teste: H2 em memória (modo PostgreSQL), sem credenciais reais.
# As mesmas migrations do Flyway criam o schema.
spring.datasource.url=jdbc:h2:mem:clinica-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Token fictício usado somente nos testes
clinica.admin.api-token=token-de-teste-com-pelo-menos-32-caracteres

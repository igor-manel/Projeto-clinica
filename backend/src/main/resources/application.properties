spring.application.name=clinica-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema versionado pelo Flyway (src/main/resources/db/migration);
# o Hibernate apenas confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Erros da API não expõem detalhes internos do servidor
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Token da API administrativa. Sem valor definido, /api/admin/** fica desabilitado.
clinica.admin.api-token=${ADMIN_API_TOKEN:}
